name: Build Binaries

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: gws-agent-windows.exe
            pyinstaller_args: "--onefile --name gws-agent"
          - os: ubuntu-latest
            artifact_name: gws-agent-linux
            pyinstaller_args: "--onefile --name gws-agent"
          - os: macos-latest
            artifact_name: gws-agent-macos
            pyinstaller_args: "--onefile --name gws-agent"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller ${{ matrix.pyinstaller_args }} gws_cli.py

      - name: Rename Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mv dist/gws-agent dist/${{ matrix.artifact_name }}

      - name: Rename Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          move dist\gws-agent.exe dist\${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
