[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-workspace-assistant"
version = "1.0.0"
description = "Professional CLI and GUI assistant for Google Workspace gws commands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3.84",
    # NOTE: langchain-openai 1.1.14 patches CVE-2026-41488 but requires
    # openai>=2.26.0; litellm 1.83.14 pins openai==2.24.0, so the CVE fix is
    # currently blocked on litellm upstream. Pin to 1.1.10 (the highest
    # release compatible with the rest of the dep tree) until litellm allows
    # openai>=2.26.0; then bump to >=1.1.14.
    "langchain-openai>=1.1.10,<1.1.11",
    "langgraph>=0.3.34",
    "langchain-community>=0.3.31",
    "langchain-tavily>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "RestrictedPython>=8.1",
    "httpx>=0.28.1",
    # openai 2.24.0 is required by litellm 1.83.14; align the floor here.
    "openai>=2.24.0,<3.0.0",
    "python-dotenv>=1.2.1",
    "typer>=0.24.0",
    "rich>=14.3.3",
    "questionary>=2.1.1",
    "customtkinter>=5.2.2",
    "gradio>=5.27.0",
    "e2b-code-interpreter>=1.0.0",
    "mem0ai>=2.0.0",
    "litellm>=1.83.14",
    "python-telegram-bot>=22.7",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
gws-assistant-cli = "gws_assistant.cli_app:main"
gws-assistant-gui = "gws_assistant.gui_app:main"
gws-assistant-gradio = "gws_assistant.gradio_app:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

# Pytest configuration lives in pytest.ini (single source of truth).

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Ignore E402 (import not at top) in tests because we often call load_dotenv() before imports
"tests/**/*.py" = ["E402"]
"test_heuristic.py" = ["E402"]

[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "C0103", # invalid-name
    "R0903", # too-few-public-methods
    "W0511", # fixme
]
max-line-length = 120

[tool.pyright]
include = ["gws_assistant"]
exclude = ["**/__pycache__", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"




