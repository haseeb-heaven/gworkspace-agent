name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: gws-agent-windows.exe
          - os: ubuntu-latest
            artifact_name: gws-agent-linux
          - os: macos-latest
            artifact_name: gws-agent-macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import importlib.util

          sep = ";" if sys.platform == "win32" else ":"

          # Locate litellm package directory
          spec = importlib.util.find_spec("litellm")
          litellm_dir = os.path.dirname(spec.origin)

          # Collect all data files litellm needs at runtime
          # (JSON files, py.typed marker, etc.)
          add_data_args = []
          for root, dirs, files in os.walk(litellm_dir):
              for fname in files:
                  if fname.endswith((".json", ".typed", "py.typed")):
                      src = os.path.join(root, fname)
                      # destination inside the bundle mirrors the package structure
                      rel = os.path.relpath(root, os.path.dirname(litellm_dir))
                      add_data_args += ["--add-data", f"{src}{sep}{rel}"]

          cmd = [
              sys.executable, "-m", "PyInstaller",
              "--onefile",
              "--name", "gws-agent",
              "--collect-all", "litellm",
              "--collect-all", "langchain",
              "--collect-all", "langchain_core",
              "--collect-all", "langchain_community",
              "--collect-all", "langchain_openai",
              "--collect-all", "langgraph",
              "--collect-all", "tiktoken",
              "--collect-all", "tiktoken_ext",
              "--hidden-import", "tiktoken_ext",
              "--hidden-import", "tiktoken_ext.openai_public",
              *add_data_args,
              "gws_cli.py",
          ]
          print("Running:", " ".join(cmd))
          result = subprocess.run(cmd)
          sys.exit(result.returncode)

      - name: Rename Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mv dist/gws-agent dist/${{ matrix.artifact_name }}

      - name: Rename Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          move dist\gws-agent.exe dist\${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
